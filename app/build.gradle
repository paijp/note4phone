plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "jp.pai.callrectest"
    compileSdk 33

    defaultConfig {
        applicationId "jp.pai.callrectest"
        minSdk 26          // Android 8.0 (KEYoneの最終OS)
        targetSdk 33
        // CI の実行番号をそのままバージョンにする（更新チェックで比較する）
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // ビルド環境が変わっても同じ署名になるよう、リポジトリ内の鍵で署名する（上書き更新に必要）
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
