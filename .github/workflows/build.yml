name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'rel/**'
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # rel/ に APK とバージョン番号を置く（アプリの更新チェックが参照する）
      - name: Commit APK to rel/
        run: |
          mkdir -p rel
          cp app/build/outputs/apk/debug/app-debug.apk rel/CallRecTest.apk
          echo "$GITHUB_RUN_NUMBER" > rel/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rel/
          git diff --staged --quiet || git commit -m "build: update APK ($GITHUB_RUN_NUMBER)"
          git push origin HEAD:main
